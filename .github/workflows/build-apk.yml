name: Build K-MAP Solver APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Buildozer's Docker image handles the Android build environment.
      # "yes" automatically accepts SDK licenses so the build does not stop
      # before build-tools/AIDL are installed.
      - name: Build APK with Buildozer
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: yes | buildozer -v android debug
          buildozer_version: stable

      - name: Rename APK
        shell: bash
        run: |
          set -e
          APK="$(find . -type f -name '*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "No APK was produced."
            exit 1
          fi
          mkdir -p release
          cp "$APK" "release/K-MAP_Solver_by_Salman.apk"
          echo "APK created: release/K-MAP_Solver_by_Salman.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: K-MAP-Solver-by-Salman
          path: release/K-MAP_Solver_by_Salman.apk
          if-no-files-found: error
